# Valida contenido, ejecuta tests y compila en cada push y pull request.
# Solo despliega a GitHub Pages desde main y solo si todo lo anterior pasa.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validar, testear y compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # CI=true lo define GitHub: los IDs nuevos sin registrar en ids.lock.json son error.
      - name: Validar contenido
        run: npm run validate-content

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Configuración PÚBLICA de Supabase (Settings → Secrets and variables → Actions →
      # Variables). Si no existe, la app se compila sin sincronización.
      - name: Build de producción
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Sin secretos en el bundle
        run: npm run check-secrets

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  database:
    name: Base de datos (migraciones y RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0

      # Arranca solo Postgres local (Docker) y aplica supabase/migrations.
      - name: Arrancar Postgres con las migraciones
        run: supabase db start

      # Falla también si no se ejecuta ningún test (p. ej. si cambia la ruta de los archivos),
      # y publica el resumen como anotación, visible sin abrir los logs.
      - name: Tests de seguridad (pgTAP)
        run: |
          supabase test db | tee pgtap.log
          summary=$(grep -oE 'Files=[0-9]+, Tests=[0-9]+' pgtap.log || true)
          if [ -z "$summary" ] || echo "$summary" | grep -qE 'Files=0|Tests=0'; then
            echo "::error title=pgTAP::No se ejecutó ningún test de base de datos"
            exit 1
          fi
          echo "::notice title=pgTAP::$summary"

  deploy:
    name: Desplegar en GitHub Pages
    needs: [check, database]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
